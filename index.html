<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSmart — Интеллектуалды бағалау жүйесі</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-blue: #00d2ff;
            --dark-bg: #0b111b;
            --card-bg: #161e2d;
        }

        /* ЭКРАННЫҢ ДӘЛ ОРТАСЫНА ТУРАЛАУ (МАТЕМАТИКАЛЫҚ ТҰРҒЫДАН) */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh; /* Экран биіктігін толық пайдалану */
            overflow: hidden; /* Артық айналдыруды (scroll) алып тастау */
            background: var(--dark-bg);
            background-image: radial-gradient(circle at center, #1e293b 0%, #0b111b 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;    /* Вертикальді ортаға */
            justify-content: center; /* Горизонтальді ортаға */
        }

        .main-container {
            width: 98%;
            max-width: 1600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Автор блогы */
        .author {
            position: fixed;
            top: 15px;
            right: 20px;
            font-size: 0.7rem;
            color: var(--primary-blue);
            border: 1px solid var(--primary-blue);
            padding: 3px 10px;
            text-transform: uppercase;
        }

        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .neon-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-blue), 0 0 20px var(--primary-blue);
            margin: 0;
        }

        .download-btn {
            margin: 15px 0;
            background: transparent;
            color: var(--primary-blue);
            border: 1.5px solid var(--primary-blue);
            padding: 10px 30px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: var(--primary-blue);
            color: #000;
            box-shadow: 0 0 20px var(--primary-blue);
        }

        /* 5 БАҒАНДЫ ТОР — БАРЛЫҒЫ СЫЮ ҮШІН КІШІРЕЙТІЛДІ */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
        }

        .student-card {
            background: var(--card-bg);
            border: 1px solid #2d3748;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            transition: 0.2s;
        }

        .student-card:hover {
            border-color: var(--primary-blue);
            background: #1c2539;
        }

        .student-name {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #2d3748;
            color: #fff;
            padding: 6px;
            margin-bottom: 8px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            border-radius: 3px;
            font-size: 0.75rem;
        }

        .rating-box {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-bottom: 5px;
        }

        .star {
            font-size: 18px;
            cursor: pointer;
            color: #2d3748;
            transition: 0.2s;
            user-select: none;
        }

        .star.active {
            color: #fff;
            text-shadow: 0 0 8px var(--primary-blue), 0 0 15px var(--primary-blue);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        .status-msg {
            font-size: 0.6rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #475569;
        }

        /* Монитор кіші болса, торды реттеу */
        @media (max-height: 800px) {
            .neon-title { font-size: 1.8rem; }
            .student-card { padding: 5px; }
            .star { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="author">Әзірлеуші: Алдашев Р.Б.</div>
    
    <div class="main-container">
        <div class="header-section">
            <h1 class="neon-title">GEOSMART PANEL</h1>
            <button class="download-btn" onclick="downloadExcel()">📊 ЕСЕПТІ САҚТАУ</button>
        </div>

        <div class="students-grid" id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const studentData = Array(25).fill(0).map((_, i) => ({ id: i, name: '', score: 0 }));

        for (let i = 0; i < 25; i++) {
            const card = document.createElement('div');
            card.className = 'student-card';
            card.innerHTML = `
                <input type="text" class="student-name" placeholder="ОҚУШЫ №${i+1}" oninput="updateName(${i}, this.value)">
                <div class="rating-box" id="rating-${i}">
                    ${Array(10).fill(0).map((_, j) => `<span class="star" onclick="rate(${i}, ${j + 1})">⚡</span>`).join('')}
                </div>
                <div class="status-msg" id="msg-${i}">READY</div>
            `;
            grid.appendChild(card);
        }

        function updateName(id, val) { studentData[id].name = val; }

        function rate(studentId, score) {
            studentData[studentId].score = score;
            if (score >= 9) {
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 }, colors: ['#00d2ff', '#ffffff'] });
            }
            const container = document.getElementById(`rating-${studentId}`);
            const stars = container.querySelectorAll('.star');
            stars.forEach((s, index) => s.classList.toggle('active', index < score));

            const msg = document.getElementById(`msg-${studentId}`);
            if (score <= 5) { msg.innerText = "ТӨМЕН"; msg.style.color = "#64748b"; }
            else if (score <= 8) { msg.innerText = "ОРТА"; msg.style.color = "#3a7bd5"; }
            else { msg.innerText = "ЖОҒАРЫ"; msg.style.color = "#00d2ff"; }
        }

        function downloadExcel() {
            let csvContent = "\uFEFFОқушы;Балл\n";
            studentData.forEach((s, index) => {
                let name = s.name || `${index + 1}-оқушы`;
                csvContent += `${name};${s.score}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "GeoSmart_Report.csv";
            link.click();
        }
    </script>
</body>
</html>
